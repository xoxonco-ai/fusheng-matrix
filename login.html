<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮生矩陣｜登入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ink.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="members.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link rel="stylesheet" href="warm.css">
</head>
<body>
<div class="wrap" style="max-width:460px">
  <div class="topbar" style="justify-content:center"><a class="brand" href="index.html">浮生羅盤</a></div>
  <h1>會員登入</h1>
  <p class="sub" id="modesub">登入以查看你的報告</p>

  <div class="card">
    <div class="row" style="justify-content:center;margin-bottom:8px">
      <button class="tabbtn active" id="tab-in" onclick="setMode('in')">登入</button>
      <button class="tabbtn" id="tab-up" onclick="setMode('up')">註冊</button>
    </div>
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <label for-pass>密碼</label>
    <input type="password" id="password" placeholder="至少 6 碼" autocomplete="current-password">
    <p id="forgotrow" style="margin:10px 0 0;text-align:right"><a href="#" id="forgot" class="muted" style="font-family:var(--sans);font-size:13px;text-decoration:none">忘記密碼？</a></p>
    <div style="margin-top:24px" class="center">
      <button class="btn" id="submit" style="width:100%">登入</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <p class="sub" style="margin:0"><a href="index.html" class="muted" style="text-decoration:none">← 回首頁</a></p>
</div>

<script>
const sb = supabase.createClient(window.SB_URL, window.SB_KEY);
let mode='in';
const $=id=>document.getElementById(id);
function setMode(m){mode=m;
  $('tab-in').classList.toggle('active',m==='in');
  $('tab-up').classList.toggle('active',m==='up');
  $('submit').textContent = m==='in'?'登入':(m==='up'?'註冊':'寄送重設密碼信');
  $('modesub').textContent = m==='in'?'登入以查看你的報告':(m==='up'?'建立你的帳號':'輸入 Email，我們會寄一封重設密碼的信給你');
  $('password').parentNode && ($('password').style.display = m==='reset'?'none':'');
  document.querySelector('label[for-pass]') && (document.querySelector('label[for-pass]').style.display = m==='reset'?'none':'');
  $('forgotrow').style.display = m==='in'?'':'none';
  $('password').setAttribute('autocomplete', m==='in'?'current-password':'new-password');
  hideMsg();
}
function showMsg(t,ok){const e=$('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')}
function hideMsg(){$('msg').className='msg'}

// ?next=pay/qz：從排盤頁來 → 登入後帶回繼續付款(pay)或解鎖千字(qz)；pay2/qz2 為合盤頁
const QS = new URLSearchParams(location.search);
const NEXT = QS.get('next');
async function routeByRole(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return false;
  if(NEXT==='pay'){ location.href='paipan.html?resume=pay'; return true; }
  if(NEXT==='qz'){ location.href='paipan.html?resume=qz'; return true; }
  if(NEXT==='pay2'){ location.href='hepan.html?resume=pay'; return true; }
  if(NEXT==='qz2'){ location.href='hepan.html?resume=qz'; return true; }
  const {data:prof} = await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  location.href = (prof && prof.role==='admin') ? 'admin.html' : 'report.html';
  return true;
}
if(NEXT==='pay'||NEXT==='pay2'){ document.getElementById('modesub').textContent='登入或註冊後，將帶你回到付款步驟'; }
if(NEXT==='qz'||NEXT==='qz2'){ document.getElementById('modesub').textContent='免費註冊（只需 Email），立即解鎖你的精華內容'; }

$('submit').addEventListener('click', async ()=>{
  if(typeof RECOVERY!=='undefined'&&RECOVERY) return;
  hideMsg();
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||(mode!=='reset'&&!password)){showMsg(mode==='reset'?'請填寫 Email':'請填寫 Email 與密碼',false);return}
  $('submit').disabled=true;
  try{
    if(mode==='in'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error){showMsg('登入失敗：'+error.message,false);return}
      await routeByRole();
    }else if(mode==='reset'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error){showMsg('寄送失敗：'+error.message,false);return}
      showMsg('重設信已寄出！請到信箱點擊連結，會回到本頁設定新密碼。',true);
      return;
    }else{
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:email}}});
      if(error){showMsg('註冊失敗：'+error.message,false);return}
      if(data.session){ await routeByRole(); }
      else { showMsg('註冊成功！請到信箱收確認信，點擊連結後再回來登入。（若要省略此步，可在 Supabase → Authentication → Providers → Email 關閉 Confirm email）',true); setMode('in'); }
    }
  }catch(e){showMsg('發生錯誤：'+e.message,false)}
  finally{$('submit').disabled=false}
});

$('forgot').addEventListener('click',e=>{e.preventDefault();setMode('reset')});

// 從重設信連結回來（Supabase recovery）：改用「設定新密碼」介面
let RECOVERY=false;
sb.auth.onAuthStateChange(async (event)=>{
  if(event==='PASSWORD_RECOVERY'){
    RECOVERY=true;
    $('tab-in').style.display='none';$('tab-up').style.display='none';
    $('modesub').textContent='請設定你的新密碼';
    document.querySelector('label[for-pass]').textContent='新密碼';
    $('password').style.display='';$('password').placeholder='至少 6 碼';
    $('forgotrow').style.display='none';
    $('submit').textContent='更新密碼';
  }
});
const _origSubmit=$('submit');
_origSubmit.addEventListener('click', async ()=>{
  if(!RECOVERY) return;
  const password=$('password').value;
  if(!password||password.length<6){showMsg('新密碼至少 6 碼',false);return}
  const {error}=await sb.auth.updateUser({password});
  if(error){showMsg('更新失敗：'+error.message,false);return}
  showMsg('密碼已更新，正在帶你進入報告頁…',true);
  RECOVERY=false;
  setTimeout(()=>routeByRole(),800);
},true);

$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});

// ?mode=up → 預設切到註冊分頁
if(QS.get('mode')==='up') setMode('up');
// 已登入則直接導向（重設密碼流程除外）
if(!location.hash.includes('type=recovery')) routeByRole();
</script>

<style>body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}</style>
<nav class="tabbar" aria-label="主導覽">
  <div class="tabs">
    <a href="index.html"><span class="g" aria-hidden="true">浮</span>首頁</a>
    <a href="paipan.html"><span class="g" aria-hidden="true">排</span>排盤</a>
    <a href="hepan.html"><span class="g" aria-hidden="true">合</span>合盤</a>
    <a class="active" href="login.html"><span class="g" aria-hidden="true">我</span>我的</a>
  </div>
</nav>
</body>
</html>
