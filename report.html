<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮生矩陣｜我的報告</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ink.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="members.css">
<style>
:root{--bg:#f4efe5;--bg2:#faf6ec;--bg3:#ffffff;--text:#2c251c;--muted:#807664;--gold:#9c7043;--gold-bright:#7a5630;--line:#ddd4c2;--crimson-bright:#a8412f}
body{background:var(--bg);color:var(--text)}
.topbar .brand{color:var(--text)}
.wrap .sub{color:var(--muted)}
h1{font-weight:600}
body::before{display:none}
.wrap{max-width:860px;padding-bottom:140px}
h1{background:none;color:var(--text);letter-spacing:.04em}
.parallel{display:block}
.vcol,.vcol:has(.vhead.breakthrough),.vcol:has(.vhead.clash){background:none;border:0;border-radius:0;padding:32px 0 48px;box-shadow:none}
.vcol+.vcol{border-top:1px solid var(--line)}
.report-body,.excerpt-body{white-space:normal;font-size:18px;font-weight:400;line-height:1.95;overflow-wrap:anywhere;max-width:38em;margin-inline:auto}
.report-body p,.excerpt-body p{margin:0 0 1.3em}
.report-body h3,.excerpt-body h3{font-family:var(--serif);font-size:1.3em;line-height:1.5;margin:2.4em 0 1em;color:var(--gold-bright)}
.report-body ul,.report-body ol{padding-left:1.5em;margin:0 0 1.3em}
.report-body li{margin-bottom:.5em}
.report-body strong,.excerpt-body strong{font-weight:600;color:var(--text)}
.report-body,.excerpt-body,.report-body p,.report-body li{color:var(--text)}
.case-index{position:static;background:var(--bg2);border-radius:0}
.case-name{margin-top:32px}.vhead{font-size:24px}.vhead span{font-size:14px}
@media(max-width:600px){.wrap{padding-inline:20px}.report-body,.excerpt-body{font-size:17px}.case-name span{display:block;margin-left:0}.vcol{padding-top:24px}}
@media print{.topbar,.case-index{display:none}body{background:white;color:black}.report-body,.excerpt-body{color:black}.wrap{max-width:none;padding:0}}

/* ---- 閱讀介面：版本分頁 + 章節目錄（接手自 report-preview） ---- */
.vtabs{display:flex;gap:10px;margin:26px 0 6px;flex-wrap:wrap}
.vtabs button{font-family:var(--sans);text-align:left;cursor:pointer;background:var(--bg2);border:1px solid var(--line);color:var(--muted);padding:12px 18px;min-width:150px;transition:all .15s}
.vtabs button span{display:block;font-size:12px;letter-spacing:.04em;margin-top:4px}
.vtabs button.on{background:var(--text);border-color:var(--text);color:var(--bg2)}
.vtabs button.on span{color:var(--bg)}
.vtabs button:not(.on):hover{border-color:var(--gold);color:var(--gold-bright)}
.parallel .vcol{display:none}
.parallel .vcol.show{display:block}
.reading-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:36px;align-items:start}
.toc{position:sticky;top:24px;font-family:var(--sans);font-size:13px;border-left:2px solid var(--line);padding-left:14px}
.toc p{letter-spacing:.14em;color:var(--muted);font-size:11.5px;margin-bottom:10px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0;line-height:1.6}
.toc a:hover,.toc a.now{color:var(--gold-bright)}
@media(max-width:760px){.reading-grid{display:block}.toc{position:static;border-left:0;padding:14px 16px;background:var(--bg2);margin-bottom:18px}}
.report-body h3,.excerpt-body h3{color:var(--gold-bright);scroll-margin-top:20px}
.vhead,.vhead span,.case-name,.case-name span{color:var(--text)}
.case-name span{color:var(--muted)}
.vsub{color:var(--muted)}
.locked{border:1px dashed var(--line);padding:34px;text-align:center;color:var(--muted);font-family:var(--sans)}
.card{background:var(--bg2);border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line)}

/* 底部導覽配合暖紙色＋確保蓋住內文 */
.tabbar{z-index:100;background:rgba(244,239,229,.97);border-top:1px solid var(--line)}
.tabbar a{color:var(--muted)}
.tabbar a:hover{color:var(--text)}
.tabbar a.active{color:var(--crimson-bright)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html">浮生矩陣</a>
    <div class="row">
      <span class="muted" id="who" style="font-family:var(--sans);font-size:13px"></span>
      <a class="btn ghost small" id="adminlink" href="admin.html" style="display:none">管理後台</a>
      <button class="btn ghost small" id="signout">登出</button>
    </div>
  </div>
  <h1>我的浮生矩陣報告</h1>
  <p class="sub">看見劇本，才能走出劇本</p>
  <div id="content"><div class="loadingfull">載入中…</div></div>
</div>

<script>
const sb = supabase.createClient(window.SB_URL, window.SB_KEY);
const $=id=>document.getElementById(id);
const VLABEL={script:'劇本版 · 看見人生主線', breakthrough:'破局版 · 找出困住你的劇本'};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Deliberately small Markdown subset: escape all HTML before rendering.
// No executable HTML, embedded media, or generated links are accepted.
function renderReport(text){
  const inline=s=>esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  const lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  let html='', paragraph=[], list='';
  const flush=()=>{if(paragraph.length){html+='<p>'+inline(paragraph.join('\n')).replace(/\n/g,'<br>')+'</p>';paragraph=[];}if(list){html+='</'+list+'>';list='';}};
  for(const line of lines){
    const heading=line.match(/^#{1,6}\s+(.+)$/);
    const item=line.match(/^\s*(?:([-*])|\d+[.)])\s+(.+)$/);
    if(!line.trim()){flush();continue;}
    if(heading){flush();html+='<h3>'+inline(heading[1])+'</h3>';continue;}
    if(item){const type=item[1]?'ul':'ol';if(paragraph.length||list&&list!==type)flush();if(!list){list=type;html+='<'+type+'>';}html+='<li>'+inline(item[2])+'</li>';continue;}
    if(list)flush();paragraph.push(line);
  }
  flush();return html;
}

$('signout').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.href='login.html'; });

// 訂單狀態橫幅：付款後生成中 → 每 20 秒自動更新
async function orderBanner(userId){
  const {data:orders} = await sb.from('orders').select('id,status,error,created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(1);
  const o = orders && orders[0];
  if(!o) return {html:'', generating:false};
  if(o.status==='paid'||o.status==='generating'){
    // 掉棒自癒：每 3 分鐘請後端檢查缺失的版本並補跑
    try{
      const key='fs_resume_'+o.id;
      if(Date.now()-(parseInt(localStorage.getItem(key)||'0',10)) > 180000){
        localStorage.setItem(key, String(Date.now()));
        const {data:{session}} = await sb.auth.getSession();
        if(session) fetch(window.SB_URL+'/functions/v1/generate-report',{
          method:'POST',
          headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token,'apikey':window.SB_KEY},
          body:JSON.stringify({resume_order:o.id})
        }).catch(()=>{});
      }
    }catch(e){}
    return {generating:true, html:`<div class="card center" style="border-color:var(--gold)">
      <p style="font-family:var(--sans);font-size:16px;color:var(--gold-bright);margin-bottom:6px"> 付款成功，你的報告正在生成中…</p>
      <p class="muted" style="font-family:var(--sans);font-size:13.5px;line-height:1.9">系統正依命盤撰寫兩份完整報告，約需 5～10 分鐘。<br>本頁會自動更新，也可以先關掉，之後隨時登入回來看。</p>
    </div>`};
  }
  if(o.status==='pending' && (Date.now()-new Date(o.created_at).getTime()) < 24*3600e3){
    return {generating:false, html:`<div class="card center">
      <p style="font-family:var(--sans);font-size:15px;color:var(--muted)">有一筆尚未完成的付款。若已付款成功，報告會自動開始生成；若中途取消，可以<a href="paipan.html" style="color:var(--gold-bright)">回排盤頁重新購買 →</a></p>
    </div>`};
  }
  if(o.status==='failed'){
    return {generating:false, html:`<div class="card center">
      <p style="font-family:var(--sans);font-size:15px;color:var(--crimson-bright,#d98a9c);margin-bottom:6px">報告生成遇到問題</p>
      <p class="muted" style="font-family:var(--sans);font-size:13.5px;line-height:1.9">請不用擔心，私訊我們任一平台，會盡快為你補上：
      <a href="https://www.facebook.com/floatingmatrix" target="_blank" rel="noopener" style="color:var(--gold-bright)">Facebook</a> ·
      <a href="https://www.instagram.com/floating_matrix/" target="_blank" rel="noopener" style="color:var(--gold-bright)">Instagram</a></p>
    </div>`};
  }
  return {html:'', generating:false};
}


/* 閱讀介面：版本分頁切換＋自動章節目錄（網址 hash 記住版本） */
function initReading(root){
  root.querySelectorAll('.case-block').forEach((blk,bi)=>{
    const tabs=[...blk.querySelectorAll('.vtabs button')];
    const cols=[...blk.querySelectorAll('.parallel > .vcol')];
    if(!tabs.length) return;
    // 章節目錄
    cols.forEach(colEl=>{
      const body=colEl.querySelector('.report-body'); const toc=colEl.querySelector('[data-toc]');
      if(!body||!toc) return;
      const hs=[...body.querySelectorAll('h3')];
      if(hs.length<2) return;
      hs.forEach((h,n)=>{ h.id=`c${bi}-${colEl.dataset.v}-h${n}`;
        const a=document.createElement('a'); a.href='#'+h.id; a.textContent=h.textContent; toc.appendChild(a); });
      toc.hidden=false;
    });
    const show=v=>{
      cols.forEach(c=>c.classList.toggle('show',c.dataset.v===v));
      tabs.forEach(t=>{const on=t.dataset.v===v;t.classList.toggle('on',on);t.setAttribute('aria-selected',on)});
      try{history.replaceState(null,'','#case-'+bi+'-'+v)}catch(_){}
    };
    tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
    const m=location.hash.match(new RegExp('^#case-'+bi+'-(\\w+)'));
    show(m&&cols.some(c=>c.dataset.v===m[1])?m[1]:cols[0].dataset.v);
  });
}
(async ()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }
  $('who').textContent = session.user.email;
  const {data:prof} = await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(prof && prof.role==='admin'){ $('adminlink').style.display='inline-block'; }

  // 安全函式：只回傳「自己的、已發布」報告；萬字未解鎖時 full_content 為 null（根本不送到前端）
  const {data:reports, error} = await sb.rpc('my_reports');
  const banner = await orderBanner(session.user.id);
  if(banner.generating){ setTimeout(()=>location.reload(), 20000); }

  const box=$('content');
  if(error){ box.innerHTML=`<div class="card"><div class="msg err" style="display:block">讀取失敗：${esc(error.message)}</div></div>`; return; }
  if(!reports || !reports.length){
    box.innerHTML= banner.html || `<div class="card center">
      <p style="font-family:var(--sans);font-size:16px;color:var(--gold-bright);margin-bottom:8px">登入成功</p>
      <p class="muted" style="font-family:var(--sans)">購買後，你的萬字報告就會出現在這裡。</p>
      <p class="muted" style="font-family:var(--sans);margin-top:10px;font-size:13.5px">免費的<b>千字精華</b>在排盤頁：完成排盤後，登入狀態下會直接顯示在結果最下方「伍・千字精華報告」。</p>
      <p class="muted" style="font-family:var(--sans);margin-top:14px;font-size:13.5px">還沒有報告？先免費排盤，再付費解鎖（單人萬字 NT$888／情侶合盤 NT$1,288）。</p>
      <div class="row" style="justify-content:center;margin-top:16px">
        <a class="btn small" href="paipan.html">免費排盤・解鎖萬字 NT$888 →</a>
        <a class="btn ghost small" href="hepan.html">情侶合盤 NT$1,288 →</a>
      </div>
      <p class="muted" style="font-family:var(--sans);margin-top:18px;font-size:12.5px">付款或使用遇到問題？私訊：
        <a href="https://www.facebook.com/floatingmatrix" target="_blank" rel="noopener" style="color:var(--gold-bright)">Facebook</a> ·
        <a href="https://www.instagram.com/floating_matrix/" target="_blank" rel="noopener" style="color:var(--gold-bright)">Instagram</a> ·
        <a href="https://www.threads.com/@floating_matrix" target="_blank" rel="noopener" style="color:var(--gold-bright)">Threads</a>
      </p>
    </div>`;
    return;
  }
  // 依個案分組，劇本版 / 破局版 並列
  const byCase={};
  reports.forEach(r=>{ (byCase[r.case_id]=byCase[r.case_id]||{info:r,v:{}}); byCase[r.case_id].v[r.version]=r; });
  const VL={script:'劇本版',breakthrough:'破局版',sync:'同頻版',clash:'碰撞版'};
  const VS={script:'看見你的人生主線',breakthrough:'找出困住你的劇本',sync:'你們怎麼吸引彼此',clash:'你們怎麼互相消耗'};
  const col=(g,ver)=>{
    const r=g.v[ver];
    if(!r) return `<div class="vcol" data-v="${ver}"><div class="vhead ${ver}">${VL[ver]}</div><p class="muted" style="font-family:var(--sans);padding:10px 0">尚未提供</p></div>`;
    const full = r.full_content
      ? `<div class="report-body">${renderReport(r.full_content)}</div>`
      : `<div class="locked"><div class="lock-ic">🔒</div><p>完整萬字報告尚未解鎖</p><p class="muted">付費解鎖後即可查看</p></div>`;
    return `<div class="vcol" data-v="${ver}">
      <div class="reading-grid"><nav class="toc" data-toc hidden><p>本篇目錄</p></nav><div class="vmain">
      <div class="vhead ${ver}">${VL[ver]}<span>${VS[ver]}</span></div>
      ${r.excerpt?`<p class="vsub">千字精華</p><div class="excerpt-body">${renderReport(r.excerpt)}</div>`:''}
      <hr><p class="vsub">完整報告</p>${full}
      </div></div>
    </div>`;
  };
  const groups=Object.values(byCase);
  const idx = groups.length>1
    ? `<div class="case-index"><span>個案：</span>${groups.map((g,i)=>`<a href="#case-${i}">${esc(g.info.case_name||'命盤')}</a>`).join('')}</div>`
    : '';
  box.innerHTML = banner.html + idx + groups.map((g,i)=>{
    const c=g.info;
    const pair = (g.v.sync||g.v.clash) ? ['sync','clash'] : ['script','breakthrough'];
    return `<div class="case-block" id="case-${i}">
      <h2 class="case-name">${esc(c.case_name||'我的命盤')}<span>${esc(c.birth_date||'')} ${esc(c.birth_place||'')}</span></h2>
      <div class="vtabs" role="tablist">${pair.map(v=>`<button role="tab" data-v="${v}">${VL[v]}<span>${VS[v]}</span></button>`).join('')}</div>
      <div class="parallel">${col(g,pair[0])}${col(g,pair[1])}</div>
    </div>`;
  }).join('');
  initReading(box);
})();
</script>

<style>body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}</style>
<nav class="tabbar" aria-label="主導覽">
  <div class="tabs">
    <a href="index.html"><span class="g" aria-hidden="true">浮</span>首頁</a>
    <a href="paipan.html"><span class="g" aria-hidden="true">排</span>排盤</a>
    <a href="hepan.html"><span class="g" aria-hidden="true">合</span>合盤</a>
    <a class="active" href="login.html"><span class="g" aria-hidden="true">我</span>我的</a>
  </div>
</nav>
<script src="fusheng-widget.js" defer></script>
</body>
</html>
